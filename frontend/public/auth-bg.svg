<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="0.55" stop-color="#11151c"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#ee6a24" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#d9321a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d9321a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#3b4a63" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b4a63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9321a" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#e9501f" stop-opacity="0.85"/>
      <stop offset="0.75" stop-color="#ee6a24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f6b233" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1100" fill="url(#bg)"/>
  <rect width="900" height="1100" fill="url(#grid)"/>
  <rect width="900" height="1100" fill="url(#glow)"/>
  <rect width="900" height="1100" fill="url(#glow2)"/>

  <!-- Three documents being reconciled: PO, delivery receipt, invoice -->
  <g transform="translate(470 150) rotate(-8)">
    <rect width="250" height="320" rx="16" fill="url(#sheet)" stroke="#ffffff" stroke-opacity="0.16"/>
    <rect x="24" y="26" width="58" height="26" rx="7" fill="#ffffff" fill-opacity="0.12"/>
    <text x="53" y="44" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#ffffff" fill-opacity="0.75">PO</text>
    <g fill="#ffffff" fill-opacity="0.14"><rect x="24" y="76" width="200" height="8" rx="4"/><rect x="24" y="98" width="160" height="8" rx="4"/><rect x="24" y="140" width="200" height="8" rx="4"/><rect x="24" y="162" width="120" height="8" rx="4"/><rect x="24" y="204" width="180" height="8" rx="4"/></g>
  </g>
  <g transform="translate(560 330) rotate(4)">
    <rect width="250" height="320" rx="16" fill="url(#sheet)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="24" y="26" width="58" height="26" rx="7" fill="#ffffff" fill-opacity="0.12"/>
    <text x="53" y="44" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#ffffff" fill-opacity="0.75">DR</text>
    <g fill="#ffffff" fill-opacity="0.14"><rect x="24" y="76" width="200" height="8" rx="4"/><rect x="24" y="98" width="140" height="8" rx="4"/><rect x="24" y="140" width="190" height="8" rx="4"/></g>
    <rect x="24" y="182" width="120" height="10" rx="5" fill="#ee6a24" fill-opacity="0.75"/>
  </g>
  <g transform="translate(430 470) rotate(-3)">
    <rect width="260" height="330" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.22"/>
    <rect x="24" y="26" width="64" height="26" rx="7" fill="#ffffff" fill-opacity="0.14"/>
    <text x="56" y="44" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#ffffff" fill-opacity="0.8">INV</text>
    <g fill="#ffffff" fill-opacity="0.15"><rect x="24" y="78" width="210" height="8" rx="4"/><rect x="24" y="100" width="150" height="8" rx="4"/><rect x="24" y="142" width="210" height="8" rx="4"/></g>
    <rect x="24" y="166" width="96" height="10" rx="5" fill="#ee6a24" fill-opacity="0.85"/>
    <g transform="translate(176 250)">
      <circle r="34" fill="#2f6b3f" fill-opacity="0.9"/>
      <path d="m-15 1 10 10 20-22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Swoosh echoing the logo -->
  <path d="M-40 760C120 900 520 900 960 520" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round"/>
  <path d="M-40 800C160 930 560 920 960 600" fill="none" stroke="url(#ring)" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- Data pixels -->
  <g fill="#ee6a24">
    <rect x="760" y="110" width="26" height="26" rx="5" fill-opacity="0.85"/>
    <rect x="800" y="80" width="14" height="14" rx="3" fill-opacity="0.7"/>
    <rect x="806" y="150" width="20" height="20" rx="4" fill-opacity="0.6"/>
    <rect x="842" y="118" width="12" height="12" rx="3" fill-opacity="0.5"/>
    <rect x="730" y="168" width="10" height="10" rx="2" fill-opacity="0.45"/>
  </g>
</svg>
